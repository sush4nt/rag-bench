global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ragbench
    metrics_path: /metrics
    static_configs:
      # `ragbench` is the compose service name; use localhost:8080 for local runs.
      - targets: ["ragbench:8080"]
        labels:
          service: ragbench

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

[project]
name = "ragbench"
version = "0.1.0"
description = "RAGBench — production retrieval strategy benchmarking platform (BM25 / Dense / Hybrid / Reranked)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RAGBench" }]

dependencies = [
    # --- Serving ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # --- Config / IO ---
    "pyyaml>=6.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "numpy>=1.26",
    # --- Retrieval backends ---
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",
    "sentence-transformers>=3.0",
    "qdrant-client[fastembed]>=1.11",
    # --- Eval / tracking ---
    "mlflow>=2.14",
    "pandas>=2.2",
    # --- Monitoring ---
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
# RAGAS generation eval is expensive (LLM judge) and pulls a heavy dep tree.
# Keep it opt-in: `uv sync --extra ragas`.
ragas = [
    "ragas>=0.2.0",
    "datasets>=2.19",
    "anthropic>=0.34",
    "langchain-anthropic>=0.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
ragbench-index = "ragbench.indexing.build:main"
ragbench-eval = "ragbench.evaluation.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
